[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-claim"
dynamic = ["version"]
description = "Repository-neutral GitHub issue claims for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "agent-claim contributors"}]

[project.scripts]
agent-claim = "agent_claim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "agent_claim.__version__"}

# uv invalidates builds of path sources only via pyproject.toml's mtime by
# default, so `uv tool install --from .` can silently reinstall a cached wheel
# from an older commit (issue #70). Keying the cache on the git commit makes
# every landing invalidate it.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "FURB", "N"]
ignore = [
    # `configure_ledger` binds the process-wide ledger issue number once, at
    # startup, before any CLI action runs -- the one deliberate module-level
    # configuration global in the codebase, not a state bug awaiting a
    # refactor. Permanent policy.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# Test literals are scenario data, not domain magic numbers; a pytest test
# function's parameter list is shaped by fixture injection and
# `parametrize`, not a free design choice, so its argument count isn't a
# design smell the way a production function's is. This is a standing
# policy for fixture-shaped signatures, not a per-finding exception, so it
# stays a file-wide ignore rather than a line marker.
"tests/**" = ["PLR2004", "PLR0913", "PLR0917"]

[tool.importlinter]
root_package = "agent_claim"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["agent_claim"]
layers = [
    "cli",
    "checkout | discovery | store",
    "github",
    "forge",
    "board",
    "protocol",
    "process",
]

[[tool.importlinter.contracts]]
name = "The claim-state store is git transport only"
type = "forbidden"
source_modules = ["agent_claim.store"]
forbidden_modules = [
    "agent_claim.github",
    "agent_claim.forge",
    "agent_claim.board",
    "agent_claim.checkout",
    "agent_claim.discovery",
]
allow_indirect_imports = true
as_packages = false

[[tool.importlinter.contracts]]
name = "Only the process boundary imports subprocess"
type = "forbidden"
source_modules = ["agent_claim", "agent_claim.*"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true
as_packages = false
ignore_imports = ["agent_claim.process -> subprocess"]

[[tool.importlinter.contracts]]
name = "Only the gh and git owners run commands"
type = "forbidden"
source_modules = ["agent_claim", "agent_claim.*"]
forbidden_modules = ["agent_claim.process"]
allow_indirect_imports = true
as_packages = false
ignore_imports = [
    "agent_claim.github -> agent_claim.process",
    "agent_claim.checkout -> agent_claim.process",
    "agent_claim.store -> agent_claim.process",
]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "build>=1",
    "ruff==0.16.2",
    "vulture==2.16",
    "import-linter==2.13",
    "pyright==1.1.411",
]
