name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Check source
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked pyright src tests scripts
      - name: Check for dead code
        run: uv run --locked vulture src scripts/vulture_whitelist.py --min-confidence 60
      - name: Check root layout
        run: uv run --locked python scripts/check_root_layout.py
      - name: Check architecture contracts
        run: uv run --locked lint-imports
      - if: matrix.python != '3.12'
        run: uv run --locked pytest
      - if: matrix.python == '3.12'
        run: >-
          uv run --locked pytest --cov=agent_claim --cov-report=xml:coverage.xml
          --cov-fail-under=100
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # ~25s üblich, gemessen 30.08. (12 grüne main-Runs; mean 23s, max 26s)
    timeout-minutes: 3
    steps:
      - name: Check out the event commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        # The gitleaks-action wrapper requires an organization license key;
        # the MIT-licensed binary itself does not, so it is fetched directly
        # and verified against the release checksum.
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Reading every ref judged unmerged foreign work and held the trunk and
      # every open pull request red (#968); the range is what this event
      # actually brings. `-m` is load-bearing: a secret introduced only in a
      # merge commit's conflict resolution is invisible without it.
      #
      # The report is written outside the checkout on purpose. The checkout is
      # the pull request's own tree, so a report path inside it could already
      # be a symlink: gitleaks reads the tree's .gitleaks.toml and can exit
      # before overwriting that path, and the upload follows symlinks — which
      # would publish whatever the link points at to a world-readable artifact.
      #
      # A force-push to main can drop the `before` commit off every ref, so it
      # is never fetched and the base does not resolve. The job then fails loud
      # and scans nothing, deliberately: rewriting the trunk's history is for a
      # human to look at, not for this gate to paper over with machinery.
      - name: Scan the event's own commits for secrets
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          if ! base_commit="$(git rev-parse --verify --quiet "${SECRET_SCAN_BASE_SHA}^{commit}")"; then
            echo "::error::base revision '${SECRET_SCAN_BASE_SHA}' does not resolve to a commit; refusing to report a scan that covered nothing" >&2
            exit 1
          fi
          scan_status=0
          ./gitleaks git --redact --no-banner \
            --log-opts="${base_commit}..HEAD --diff-filter=uxdb -m" \
            --report-format json --report-path "${SECRET_SCAN_REPORT}" . || scan_status=$?
          if [ -L "${SECRET_SCAN_REPORT}" ] || [ ! -f "${SECRET_SCAN_REPORT}" ]; then
            echo "::error::the scan left no regular report file at ${SECRET_SCAN_REPORT}; there is no evidence to publish" >&2
            exit 1
          fi
          exit "${scan_status}"

      # The repository is public, so its artifacts are world-readable: the
      # report stays redacted and names rule, file, commit, line and author
      # without the value. Findings exit 1, so the upload cannot wait on
      # success; a missing report is already the scan step's loud failure and
      # does not need a second red here.
      - name: Upload the secret-scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  sonar:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-report
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code" (issue #143); this queries the authenticated API
      # directly for that stronger bar and fails loud, with the list, when it
      # is not met. Anonymous api/issues/search answers HTTP 200 with total: 0
      # for a private project, indistinguishable from a clean one, so every
      # request carries SONAR_TOKEN and the resolved component is checked
      # before counting (issue #169).
      - name: SonarCloud open findings
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN is not set; refusing to read an unauthenticated response as clean" >&2
            exit 1
          fi
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_query="pullRequest=${PULL_REQUEST_NUMBER}"
          else
            scope_query="branch=main"
          fi
          python3 - "${component_key}" "${scope_query}" <<'PYTHON'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          component_key, scope_query = sys.argv[1], sys.argv[2]
          auth_headers = {"Authorization": f"Bearer {os.environ['SONAR_TOKEN']}"}

          def fetch_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=auth_headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      status, body = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, body = error.code, error.read()
              try:
                  return json.loads(body)
              except json.JSONDecodeError:
                  endpoint = url.split("?", 1)[0]
                  snippet = body.decode("utf-8", errors="replace")[:200]
                  print(
                      f"SonarCloud answered {status} with a non-JSON body for {endpoint}: {snippet}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          def resolve_component(key: str, scope: str) -> None:
              measures = fetch_json(
                  "https://sonarcloud.io/api/measures/component"
                  f"?component={key}&metricKeys=violations&{scope}"
              )
              errors = measures.get("errors")
              resolved_key = measures.get("component", {}).get("key")
              if errors:
                  reason = errors[0]["msg"]
              elif resolved_key is None:
                  reason = "no component in the response"
              elif resolved_key != key:
                  reason = f"resolved to {resolved_key!r} instead"
              else:
                  return
              message = f"SonarCloud refused to resolve project {key!r} for {scope}: {reason}"
              if not os.environ.get("SONAR_TOKEN"):
                  message += (
                      " (no SONAR_TOKEN was sent; the project may have become private"
                      " and this step then needs one)"
                  )
              print(message, file=sys.stderr)
              sys.exit(1)

          resolve_component(component_key, scope_query)

          def fetch_page(page: int) -> dict:
              url = (
                  "https://sonarcloud.io/api/issues/search"
                  f"?componentKeys={component_key}&{scope_query}&statuses=OPEN&ps=100&p={page}"
              )
              return fetch_json(url)

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) on new code", file=sys.stderr)
              sys.exit(1)

          print(f"SonarCloud clean for {component_key!r} ({scope_query}): {total} open finding(s)")
          PYTHON
