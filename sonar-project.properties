sonar.organization=overnightworks
sonar.projectKey=overnightworks_agent-claim

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

# The zero-findings gate (issue #143, "Check for open SonarCloud findings" step
# in .github/workflows/ci.yml) queries the analysis right after this scan
# posts it; without waiting, that query can race a still-processing report and
# read stale (or absent) results.
sonar.qualitygate.wait=true

sonar.issue.ignore.multicriteria=e1,e2,e3
# python:S5886 / python:S5890 - the scanner's bundled stub types dataclasses.replace as
# returning DataclassInstance; typeshed, mypy and pyright type it as the same dataclass.
# Return- and assignment-type consistency is owned by the pyright CI gate (the
# "Check types" step in .github/workflows/ci.yml, `uv run --locked pyright src tests`),
# a stronger check than this rule. Re-enable if that gate is ever removed. See #103.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
# python:S5332 - the printed URL is loopback-only (127.0.0.1), never exposed
# beyond the local host; the token travels in that URL, and TLS on loopback
# would protect nothing it is not already protected from. Owner: issue #280
# line 3 (loopback only, no TLS by ruled design).
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=src/agent_coordination/board_serve.py
